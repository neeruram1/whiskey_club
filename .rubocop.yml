plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec

inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/*"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "storage/**/*"
    - "config/**/*"

# --- Layout / style: relax the noisiest opinions for a small app ---
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

# Seed scripts legitimately print progress to stdout.
Rails/Output:
  Exclude:
    - "db/seeds.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# --- RSpec: keep signal high, avoid dogmatic failures ---
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

RSpec/MultipleMemoizedHelpers:
  Enabled: false
